# Runs on the VPS: production in /opt/lookout (port 3200), staging in /opt/lookout-staging
# (port 3201). COMPOSE_PROJECT, LOOKOUT_IMAGE and APP_PORT come from each directory's .env.
# Caddy (Plane's proxy container) terminates TLS. Postgres is not exposed outside the compose network.
name: ${COMPOSE_PROJECT:-lookout}
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lookout
      POSTGRES_DB: lookout
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    volumes:
      - ./pg:/var/lib/postgresql/data
      - ./secrets/db_password:/run/secrets/db_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookout"]
      interval: 10s
      retries: 5
    mem_limit: 256m

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    env_file: .env.searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  app:
    image: ${LOOKOUT_IMAGE:-lookout:latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started
    volumes:
      - ./data:/data
    ports:
      - "172.17.0.1:${APP_PORT:-3200}:3000"
    mem_limit: 1g   # headless Chromium for auto-apply needs ~300 MB while it runs
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    security_opt:
      - no-new-privileges:true
