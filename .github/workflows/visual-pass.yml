# Visual pass (#1217): every signed-in page at 375px and 1280px from the made-up demo account, signed in as the admin
# so the admin pages are included. Starts compose.yaml like the self-host smoke test and seeds Maya Ortiz (#415).
# The images come back as an artifact for review. Nothing here touches a real server or real data.
name: Visual pass

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/visual-pass.mjs
      - scripts/demo-data.ts
      - .github/workflows/visual-pass.yml

permissions:
  contents: read

concurrency:
  group: visual-pass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    name: Every page, phone and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Maya is the admin here, so the admin pages show up too.
      ADMIN: demo@example.com
      DEMO: demo@example.com
      BASE: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start Lookout
        run: |
          scripts/selfhost-env.sh "$ADMIN"
          # The seed runs from this checkout, so Postgres gets a localhost port for this run only.
          printf 'services:\n  db:\n    ports: ["127.0.0.1:5432:5432"]\n' > "$RUNNER_TEMP/db-port.yaml"
          docker compose -f compose.yaml -f "$RUNNER_TEMP/db-port.yaml" up -d --build

      - name: Wait for /api/health
        run: |
          for i in $(seq 60); do
            if curl -fsS "$BASE/api/health" | grep -q '"ok":true'; then exit 0; fi
            sleep 3
          done
          echo "app never reported healthy"; exit 1

      - name: Seed the demo account
        run: |
          pw=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2)
          DATABASE_URL="postgres://lookout:$pw@127.0.0.1:5432/lookout" npx tsx scripts/seed-demo.ts "$DEMO"

      - name: Take the screenshots
        run: |
          link=$(docker compose exec -T app node scripts/login-link.mjs "$DEMO" | head -1)
          CHROME_PATH=$(command -v google-chrome) node scripts/visual-pass.mjs --base "$BASE" --link "$link" --out out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-pass-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: App log
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Start over
        if: always()
        run: docker compose down -v
