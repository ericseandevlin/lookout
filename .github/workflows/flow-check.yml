# Flow check (#996): walks the main flows of docs/flows.md on a fresh compose.yaml stack built from this commit, signed
# in as the made-up demo account, and reports broken links, failed requests, script errors, dead ends and steps that
# do not say what happens next. The report goes to the run summary and an artifact. It opens no issues and fails
# only if the walk itself breaks. Nothing here touches a real server or real data. See docs/flow-check.md.
name: Flow check

on:
  schedule:
    - cron: "41 11 * * 1" # Mondays, after the self-host smoke test
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/flow-check.mjs
      - scripts/flow-check-rules.mjs
      - .github/workflows/flow-check.yml

permissions:
  contents: read

concurrency:
  group: flow-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walk:
    name: Walk the main flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The admin is someone else, so the walk sees what a normal person sees.
      ADMIN: ci@example.com
      DEMO: demo@example.com
      BASE: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start Lookout
        run: |
          scripts/selfhost-env.sh "$ADMIN"
          printf 'services:\n  db:\n    ports: ["127.0.0.1:5432:5432"]\n' > "$RUNNER_TEMP/db-port.yaml"
          docker compose -f compose.yaml -f "$RUNNER_TEMP/db-port.yaml" up -d --build

      - name: Wait for /api/health
        run: |
          for i in $(seq 60); do
            if curl -fsS "$BASE/api/health" | grep -q '"ok":true'; then exit 0; fi
            sleep 3
          done
          echo "app never reported healthy"; exit 1

      - name: Seed the demo account
        run: |
          pw=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2)
          DATABASE_URL="postgres://lookout:$pw@127.0.0.1:5432/lookout" npx tsx scripts/seed-demo.ts "$DEMO"

      - name: Walk the flows
        run: |
          link=$(docker compose exec -T app node scripts/login-link.mjs "$DEMO" | head -1)
          CHROME_PATH=$(command -v google-chrome) node scripts/flow-check.mjs --base "$BASE" --link "$link" --submit --out out
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: flow-check-${{ github.sha }}
          path: out/
          if-no-files-found: warn
          retention-days: 30

      - name: App log
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Start over
        if: always()
        run: docker compose down -v
