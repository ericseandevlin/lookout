# Checks on every pull request, every push to main and prod, and every release build (release.yml).
# "checks" (typecheck, lint, tests) must pass before a PR can merge. See README > How we work.
name: CI

on:
  pull_request:
  push:
    branches: [main, prod]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Fails if coverage drops below the floor in vitest.config.mts (#291).
      - run: npm run test:coverage
      # Code quality report, informational only: every ESLint finding plus complexity hotspots.
      # Runs on the runner; no third-party service sees the code.
      - name: Quality report
        if: ${{ !cancelled() }}
        run: |
          npx eslint --rule '{"complexity": ["warn", 15]}' -f json -o eslint-report.json . || true
          node scripts/ci-report.mjs coverage/coverage-summary.json eslint-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Fails on high or critical advisories in packages that ship to production.
      - run: npm audit --omit=dev --audit-level=high

  semgrep:
    name: Semgrep (code security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/ci --config p/typescript --metrics=off --error --exclude node_modules --exclude .next

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.29.1 git /repo --no-banner --redact --exit-code 1
