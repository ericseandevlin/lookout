# Checks on every pull request, every push to main and prod, and every release build (release.yml).
# "checks" (typecheck, lint, tests) must pass before a PR can merge. See README > How we work.
# Actions minutes are billed per job, rounded up to a minute (#473), so the short scans share one job
# and pull requests that only touch docs skip CI. README.md still runs it: envDocs.test.ts reads it.
name: CI

on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "README.md"
  push:
    branches: [main, prod]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Fails if coverage drops below the floor in vitest.config.mts (#291).
      - run: npm run test:coverage
      # Code quality report, informational only: every ESLint finding plus complexity hotspots.
      # Runs on the runner; no third-party service sees the code.
      - name: Quality report
        if: ${{ !cancelled() }}
        run: |
          npx eslint --rule '{"complexity": ["warn", 15]}' -f json -o eslint-report.json . || true
          node scripts/ci-report.mjs coverage/coverage-summary.json eslint-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Fails on high or critical advisories in packages that ship to production.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      # Each scan runs even if an earlier one failed, so one run shows every finding.
      - name: Semgrep (code security)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.179.0 \
            semgrep scan --config p/ci --config p/typescript --metrics=off --error --exclude node_modules --exclude .next
      - name: Secret scan (gitleaks)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.29.1 git /repo --no-banner --redact --exit-code 1
