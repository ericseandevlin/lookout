name: Idea
description: Something Lookout could do or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who has it, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should Lookout do? Rough is fine.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How we'd know it works
      description: What would someone see or be able to do afterwards?
