name: Bug
description: Something in Lookout doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to Finds\n2. Open a find\n3. ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Page or URL, browser, and phone or desktop.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, error text. Leave out personal data, resumes and keys.
