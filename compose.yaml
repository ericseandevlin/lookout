# Run Lookout on your own machine: docs/self-host.md.
#   scripts/selfhost-env.sh you@example.com   # writes .env once
#   docker compose up -d --build
# Then open http://localhost:3000. The VPS deploy uses deploy/docker-compose.yml, not this file.
name: lookout-selfhost
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lookout
      POSTGRES_DB: lookout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/selfhost-env.sh first}
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookout"]
      interval: 5s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run scripts/selfhost-env.sh first}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    image: lookout:selfhost
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://lookout:${POSTGRES_PASSWORD}@db:5432/lookout
      SEARXNG_URL: http://searxng:8080
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started
    volumes:
      - data:/data
    # Localhost only. Put a TLS proxy in front before you open it to anyone else.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Lets the Ollama preset (http://host.docker.internal:11434/v1) reach Ollama on this machine, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  pg:
  data:
